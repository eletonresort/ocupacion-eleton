<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocupación · Eleton Resort &amp; SPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,900;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --verde-osc:#0d543f; --verde:#138170; --negro:#252525; --blanco:#ffffff;
  --papel:#f2f4f1; --linea:#dfe4de; --tinta-2:#5d6b62; --laton:#a8762c; --pizarra:#4a5a6a;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Montserrat,system-ui,sans-serif; background:var(--papel); color:var(--negro);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--verde-osc);color:#fff}
.top-in{max-width:1500px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.marca{display:flex;flex-direction:column;line-height:1}
.marca b{font-family:'Playfair Display',serif;font-weight:900;font-size:20px;letter-spacing:.14em}
.marca span{font-size:10px;letter-spacing:.28em;color:#9dc7b8;margin-top:3px}
.hoy{display:flex;gap:20px;margin-left:auto;align-items:center;flex-wrap:wrap}
.hoy .k{display:flex;flex-direction:column}
.hoy .k b{font-family:'Playfair Display',serif;font-size:22px;font-weight:500;line-height:1}
.hoy .k span{font-size:10.5px;color:#9dc7b8;letter-spacing:.06em}
.modo{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:5px 6px 5px 12px;border-radius:999px}
.modo .lbl{font-size:12px;font-weight:600}
.modo button{border:0;background:#fff;color:var(--verde-osc);font-weight:600;font-size:12px;padding:5px 12px;border-radius:999px}
.modo.on{background:var(--laton)}
.modo.on button{background:rgba(0,0,0,.25);color:#fff}

/* ---------- pestañas ---------- */
.tabs{background:#fff;border-bottom:1px solid var(--linea);position:sticky;top:57px;z-index:30}
.tabs-in{max-width:1500px;margin:0 auto;padding:0 20px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tab{border:0;background:none;padding:13px 14px;font-size:13px;font-weight:600;color:var(--tinta-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--verde-osc);border-bottom-color:var(--verde-osc)}
.buscar{margin-left:auto;display:flex;align-items:center;gap:6px}
.buscar input{border:1px solid var(--linea);border-radius:var(--r);padding:6px 10px;width:230px;background:var(--papel)}

.wrap{max-width:1500px;margin:0 auto;padding:20px}
.oculto{display:none !important}

/* ---------- encabezado de mes ---------- */
.mes-bar{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.mes-tit{font-family:'Playfair Display',serif;font-size:30px;font-weight:500;line-height:1;margin:0}
.mes-tit em{font-style:italic;color:var(--tinta-2)}
.nav button{border:1px solid var(--linea);background:#fff;border-radius:var(--r);width:32px;height:32px;font-size:16px;color:var(--verde-osc)}
.nav{display:flex;gap:6px;align-items:center}
.nav .hoy-btn{width:auto;padding:0 12px;font-size:12px;font-weight:600}
.resumen{margin-left:auto;display:flex;gap:26px}
.resumen .k b{display:block;font-family:'Playfair Display',serif;font-size:20px;font-weight:500;line-height:1.1}
.resumen .k span{font-size:11px;color:var(--tinta-2)}

/* ---------- calendario ---------- */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.dow div{font-size:10.5px;letter-spacing:.1em;color:var(--tinta-2);text-align:center;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{position:relative;background:#fff;border:1px solid var(--linea);border-radius:var(--r);min-height:118px;padding:7px 8px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.dia .fill{position:absolute;left:0;right:0;bottom:0;background:var(--verde);opacity:.13;pointer-events:none}
.dia .num{font-family:'Playfair Display',serif;font-size:17px;font-weight:500;line-height:1;position:relative}
.dia .pct{position:absolute;top:6px;right:8px;font-size:12px;font-weight:700;color:var(--verde-osc)}
.dia .pax{font-size:10.5px;color:var(--tinta-2);position:relative}
.dia.vacio{background:transparent;border-color:transparent}
.dia.hoy{border-color:var(--verde-osc);box-shadow:inset 0 0 0 1px var(--verde-osc)}
.dia.pasado .num,.dia.pasado .pax{opacity:.55}
.dia.lleno .pct{color:var(--laton)}
.dia.sel{box-shadow:0 0 0 2px var(--verde-osc)}
.chips{display:flex;flex-direction:column;gap:2px;margin-top:auto;position:relative}
.chip{font-size:10px;line-height:1.3;padding:2px 5px;border-radius:2px;background:#eef2ef;color:var(--verde-osc);border-left:3px solid var(--verde);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.est{border-left-color:var(--pizarra);color:var(--pizarra);background:#eef1f4}
.chip.egr{border-left-color:var(--laton);color:#7d5a1f;background:#f6f0e4}
.chip.mas{border:0;background:none;color:var(--tinta-2);padding-left:0}

/* ---------- agenda ---------- */
.agenda{display:flex;flex-direction:column;gap:2px}
.ag-dia{display:grid;grid-template-columns:96px 74px 1fr;gap:14px;background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:10px 12px;align-items:start;text-align:left;width:100%}
.ag-f b{font-family:'Playfair Display',serif;font-size:19px;font-weight:500;display:block;line-height:1}
.ag-f span{font-size:11px;color:var(--tinta-2)}
.ag-oc{font-size:11px;color:var(--tinta-2)}
.ag-oc b{display:block;font-size:17px;font-weight:700;color:var(--verde-osc);font-family:Montserrat}
.ag-ev{display:flex;flex-direction:column;gap:5px}
.ag-ev .l{font-size:12.5px}
.ag-ev .l b{color:var(--verde-osc)}
.ag-ev .l span{color:var(--tinta-2)}
.sin{color:var(--tinta-2);font-size:12px;font-style:italic}

/* ---------- fichas de eventos ---------- */
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.ficha{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:16px 18px}
.ficha h3{font-family:'Playfair Display',serif;font-size:21px;margin:0 0 2px;font-weight:500}
.ficha .fch{font-size:12px;color:var(--laton);font-weight:600;margin-bottom:10px}
.ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.ficha dt{color:var(--tinta-2);max-width:180px}
.ficha dd{margin:0;white-space:pre-wrap}
.ficha .des{margin-top:12px;border-top:1px solid var(--linea);padding-top:10px;font-size:12.5px;white-space:pre-wrap}
.ficha .des .d{margin-bottom:6px}
.ficha .des .d b{color:var(--verde-osc)}

/* ---------- panel lateral ---------- */
.panel{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:#fff;border-left:1px solid var(--linea);box-shadow:-14px 0 40px rgba(13,84,63,.12);z-index:60;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .18s ease}
.panel.abierto{transform:none}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.panel header{padding:16px 20px;border-bottom:1px solid var(--linea);display:flex;align-items:flex-start;gap:10px}
.panel header h3{font-family:'Playfair Display',serif;font-size:22px;margin:0;font-weight:500;text-transform:capitalize}
.panel header p{margin:2px 0 0;font-size:12px;color:var(--tinta-2)}
.panel .cerrar{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--tinta-2)}
.panel .cuerpo{padding:18px 20px;overflow:auto;flex:1}
.panel footer{padding:12px 20px;border-top:1px solid var(--linea);display:flex;gap:8px;align-items:center}
.bt{border:1px solid var(--verde-osc);background:var(--verde-osc);color:#fff;padding:9px 16px;border-radius:var(--r);font-weight:600;font-size:13px}
.bt.sec{background:#fff;color:var(--verde-osc)}
.bt.mini{padding:5px 10px;font-size:12px}
.bt.borrar{border-color:#b4483c;color:#b4483c;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--papel);border-radius:var(--r);padding:9px 11px}
.kpi b{display:block;font-family:'Playfair Display',serif;font-size:23px;font-weight:500;line-height:1.1}
.kpi span{font-size:10.5px;color:var(--tinta-2)}
.campo{margin-bottom:12px}
.campo label{display:block;font-size:11px;color:var(--tinta-2);margin-bottom:3px;font-weight:600}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--linea);border-radius:var(--r);padding:7px 9px;background:#fff}
.campo textarea{min-height:60px;resize:vertical}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ev-item{border:1px solid var(--linea);border-left:3px solid var(--verde);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.ev-item h4{margin:0 0 3px;font-size:13.5px;color:var(--verde-osc)}
.ev-item .meta{font-size:11.5px;color:var(--tinta-2)}
.ev-item .info{font-size:12.5px;margin-top:5px;white-space:pre-wrap}
.sec-tit{font-size:11px;letter-spacing:.08em;color:var(--tinta-2);font-weight:700;margin:18px 0 8px;border-top:1px solid var(--linea);padding-top:12px}
.nota{font-size:11.5px;color:var(--tinta-2);background:var(--papel);padding:8px 10px;border-radius:var(--r)}
.velo{position:fixed;inset:0;background:rgba(37,37,37,.28);z-index:50}
.aviso{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--verde-osc);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:80}
.tabla-est{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
.tabla-est th{text-align:left;font-size:11px;color:var(--tinta-2);border-bottom:1px solid var(--linea);padding:8px 10px}
.tabla-est td{border-bottom:1px solid var(--linea);padding:8px 10px;vertical-align:top}
.tabla-est td:first-child{white-space:nowrap;color:var(--verde-osc);font-weight:600;width:150px}
.dos-col{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:1000px){.dos-col{grid-template-columns:1fr}}
@media(max-width:760px){
  .grid,.dow{grid-template-columns:repeat(2,1fr)}
  .dow{display:none}
  .ag-dia{grid-template-columns:1fr}
  .hoy{width:100%;margin-left:0}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="marca"><b>ELETON</b><span>RESORT &amp; SPA</span></div>
    <div class="hoy" id="hoyKpis"></div>
    <div class="modo" id="modoBox">
      <span class="lbl" id="modoLbl">Solo visualización</span>
      <button id="modoBtn">Editar</button>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tabs-in">
    <button class="tab" data-vista="cal" aria-selected="true">Calendario</button>
    <button class="tab" data-vista="agenda" aria-selected="false">Agenda</button>
    <button class="tab" data-vista="fichas" aria-selected="false">Fichas de eventos</button>
    <button class="tab" data-vista="grupos" aria-selected="false">Estudiantil y egresos</button>
    <div class="buscar"><input id="q" type="search" placeholder="Buscar evento, grupo o colegio"></div>
  </div>
</div>

<div class="wrap">
  <section id="vista-cal">
    <div class="mes-bar">
      <div class="nav">
        <button id="prev" aria-label="Mes anterior">‹</button>
        <button id="next" aria-label="Mes siguiente">›</button>
        <button class="hoy-btn" id="irHoy">Hoy</button>
      </div>
      <h2 class="mes-tit" id="mesTit"></h2>
      <div class="resumen" id="mesKpis"></div>
    </div>
    <div class="dow"><div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="vista-agenda" class="oculto">
    <div class="mes-bar"><h2 class="mes-tit" id="agTit">Próximos días</h2></div>
    <div class="agenda" id="agenda"></div>
  </section>

  <section id="vista-fichas" class="oculto">
    <div class="mes-bar"><h2 class="mes-tit">Fichas de eventos</h2></div>
    <div class="fichas" id="fichas"></div>
  </section>

  <section id="vista-grupos" class="oculto">
    <div class="mes-bar"><h2 class="mes-tit">Estudiantil y egresos</h2></div>
    <div class="dos-col">
      <div><h3 class="sec-tit" style="border:0;margin-top:0">Grupos estudiantiles</h3><table class="tabla-est" id="tEst"></table></div>
      <div><h3 class="sec-tit" style="border:0;margin-top:0">Egresos</h3><table class="tabla-est" id="tEgr"></table></div>
    </div>
  </section>
</div>

<div class="velo oculto" id="velo"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <header>
    <div><h3 id="pTit"></h3><p id="pSub"></p></div>
    <button class="cerrar" id="pCerrar" aria-label="Cerrar">×</button>
  </header>
  <div class="cuerpo" id="pCuerpo"></div>
  <footer id="pPie"></footer>
</aside>

function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromISO(s){ const [a,b,c]=s.split("-").map(Number); return new Date(a,b-1,c); }
function d(f){ return dias[f] || (dias[f] = {f}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function habs(p){ return p==null ? null : Math.round(p*CAP_HAB/100); }
function corto(f){ const x=fromISO(f); return x.getDate()+" "+MES[x.getMonth()].slice(0,3); }

function eventosDe(f){
  const e = dias[f] || {}, l = (e.ev||[]).map(v=>({...v, tipo:"ev"}));
  (DATA.estudiantil[f]||[]).forEach(t=>l.push({n:t, tipo:"est"}));
  (DATA.egresos[f]||[]).forEach(t=>l.push({n:t, tipo:"egr"}));
  return l;
}
function coincide(f){
  if(!filtro) return true;

  const txt = [e.o, e.td, e.e, ...eventosDe(f).map(v=>[v.n,v.e,v.s,v.i].join(" "))].join(" ").toLowerCase();
  return txt.includes(filtro);
}

/* ---------------- calendario ---------------- */
function pintarCal(){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById("mesTit").innerHTML = MES[m][0].toUpperCase()+MES[m].slice(1)+" <em>"+y+"</em>";
  const primero = new Date(y,m,1), offset = (primero.getDay()+6)%7, ult = new Date(y,m+1,0).getDate();
  let html = "";
  for(let i=0;i<offset;i++) html += '<div class="dia vacio"></div>';
  let sumaP=0, nP=0, llenos=0, nEv=0;
  for(let dd=1; dd<=ult; dd++){
    const f = iso(new Date(y,m,dd)), e = dias[f]||{}, evs = eventosDe(f);
    if(e.p!=null){ sumaP+=e.p; nP++; if(e.p>=95) llenos++; }
    nEv += evs.length;
    const vis = coincide(f);
    const cls = ["dia"];
    if(f===hoyISO) cls.push("hoy");
    if(f<hoyISO) cls.push("pasado");
    if(e.p>=95) cls.push("lleno");
    if(f===seleccion) cls.push("sel");
    if(!vis) cls.push("apagado");
    const chips = evs.slice(0,3).map(v=>`<div class="chip ${v.tipo}">${esc(v.n||v.s||"Evento")}</div>`).join("")
      + (evs.length>3?`<div class="chip mas">+${evs.length-3} más</div>`:"");
    html += `<button class="${cls.join(" ")}" data-f="${f}" style="${vis?"":"opacity:.25"}">
      <div class="fill" style="height:${e.p!=null?Math.min(100,e.p):0}%"></div>
      <div class="num">${dd}</div>
      ${e.p!=null?`<div class="pct">${e.p}%</div>`:""}
      <div class="pax">${e.d!=null?e.d+" duermen":"&nbsp;"}${e.b!=null?" · "+e.b+" desayunan":""}</div>
      <div class="chips">${chips}</div>
    </button>`;
  }
  document.getElementById("grid").innerHTML = html;
  document.getElementById("mesKpis").innerHTML = `
    <div class="k"><b>${nP?Math.round(sumaP/nP)+"%":"—"}</b><span>ocupación promedio</span></div>
    <div class="k"><b>${llenos}</b><span>días al 95% o más</span></div>
    <div class="k"><b>${nEv}</b><span>eventos y grupos</span></div>`;
}

  e.ev = [...document.querySelectorAll("#evs .ev-form")].map(n=>{
    const g = c => n.querySelector(c).value.trim();
    return {n:g(".e-n"), e:g(".e-e"), s:g(".e-s"), x:g(".e-x"), h:g(".e-h"), i:g(".e-i")};
  }).filter(o=>o.n||o.s||o.i);
  // el día siguiente desayuna lo que durmió hoy
  const sig = d(iso(new Date(fromISO(seleccion).getTime()+864e5)));
  if(e.d!=null && sig.b==null) sig.b = e.d;
  cerrar(); pintarTodo(); toast("Cambios guardados en esta sesión");
}
function cerrar(){
  document.getElementById("panel").classList.remove("abierto");
  document.getElementById("panel").setAttribute("aria-hidden","true");
  document.getElementById("velo").classList.add("oculto");
  seleccion = null; pintarCal();
}
function toast(t){
  const n = document.createElement("div"); n.className="aviso"; n.textContent=t;
  document.body.appendChild(n); setTimeout(()=>n.remove(), 2600);
}

/* ---------------- interacción ---------------- */
document.getElementById("grid").addEventListener("click", ev=>{
  const b = ev.target.closest(".dia[data-f]"); if(b) abrirDia(b.dataset.f);
});
document.getElementById("agenda").addEventListener("click", ev=>{
  const b = ev.target.closest(".ag-dia[data-f]"); if(b) abrirDia(b.dataset.f);
});
document.getElementById("pCerrar").onclick = cerrar;
document.getElementById("velo").onclick = cerrar;
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && seleccion) cerrar(); });
document.getElementById("prev").onclick = ()=>{ cursor.setMonth(cursor.getMonth()-1); pintarCal(); };
document.getElementById("next").onclick = ()=>{ cursor.setMonth(cursor.getMonth()+1); pintarCal(); };
document.getElementById("irHoy").onclick = ()=>{ cursor = new Date(); pintarCal(); };
document.getElementById("q").addEventListener("input", e=>{ filtro = e.target.value.trim().toLowerCase(); pintarTodo(); });
document.querySelectorAll(".tab").forEach(t=>t.onclick = ()=>{
  document.querySelectorAll(".tab").forEach(o=>o.setAttribute("aria-selected", o===t));
  ["cal","agenda","fichas","grupos"].forEach(v=>document.getElementById("vista-"+v).classList.toggle("oculto", v!==t.dataset.vista));
});
document.getElementById("modoBtn").onclick = ()=>{
  if(edicion){ edicion=false; aplicarModo(); toast("Volviste a solo visualización"); return; }
  const p = prompt("Clave de gerencia para editar:");
  if(p===null) return;
  if(p===PIN){ edicion=true; aplicarModo(); toast("Modo edición activo"); }
  else toast("Clave incorrecta");
};
function aplicarModo(){
  document.getElementById("modoBox").classList.toggle("on", edicion);
  document.getElementById("modoLbl").textContent = edicion ? "Modo edición · gerencia" : "Solo visualización";
  document.getElementById("modoBtn").textContent = edicion ? "Salir" : "Editar";
  if(seleccion) abrirDia(seleccion);
}
function pintarTodo(){ pintarHoy(); pintarCal(); pintarAgenda(); pintarFichas(); pintarGrupos(); }
pintarTodo();
</script>
